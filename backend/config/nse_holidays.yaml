# Populate from the official NSE holiday circular published each December:
#   https://www.nseindia.com/resources/exchange-communication-holidays
# A wrong holiday silently breaks expiry resolution and session handling, so only dates
# backed by evidence are listed. Format: YYYY-MM-DD: description
