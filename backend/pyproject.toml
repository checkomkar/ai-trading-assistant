[project]
name = "trader"
version = "0.1.0"
description = "NIFTY & BANKNIFTY options research and paper-trading platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "cryptography>=42",
    "httpx>=0.27",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "fyers-apiv3>=3.2.0",
    "anthropic>=1.0",
    "pypdf>=4.0",
    "pillow>=10",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trader*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
